management:
  endpoints:
    web:
      exposure:
        include: "*"
  #    prometheus:
  #      enabled: true
    endpoint:
      health:
        show-details: always
    health:
      circuitbreakers:
        enabled: true
  tracing:
    sampling:
      probability: 1.0




server:
  port: 8080

