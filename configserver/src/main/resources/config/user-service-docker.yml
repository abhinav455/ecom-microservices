management:
  endpoints:
    web:
      exposure:
        include: "*"
    prometheus:
      enabled: true
  tracing:
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      endpoint: ${ZIPKIN_URL:http://zipkin:9411/api/v2/spans}



server:
  port: 8082



eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka:8761/eureka

    register-with-eureka: true
    fetch-registry: true


logging:
#  level:
#    root: INFO
#    com.ecommerce.user: TRACE
  file:
    name: logs/${spring.application.name}.log
  logback:
    rollingpolicy:
      max-file-size: 1MB
      max-history: 7



